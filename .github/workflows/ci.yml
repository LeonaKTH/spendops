name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (unit + PostgreSQL integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spendops_app
          POSTGRES_PASSWORD: spendops_test_pw
          POSTGRES_DB: spendops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spendops_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # 集成测试连接独立测试库（库名以 _test 结尾，满足破坏性清理护栏）。
      SPENDOPS_TEST_DATABASE_URL: postgresql+asyncpg://spendops_app:spendops_test_pw@localhost:5432/spendops_test
      DATABASE_URL: postgresql+asyncpg://spendops_app:spendops_test_pw@localhost:5432/spendops_test
      JWT_SECRET: ci-test-jwt-secret-not-for-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -c "import pathlib, tomllib; d = tomllib.loads(pathlib.Path('pyproject.toml').read_text('utf-8'))['project']['dependencies']; pathlib.Path('/tmp/requirements.txt').write_text('\n'.join(d) + '\n', encoding='utf-8')"
          python -m pip install -r /tmp/requirements.txt
          python -m pip install "pytest>=8.0" "pytest-asyncio>=0.23"

      - name: Run database migrations
        run: python -m alembic upgrade head

      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 构建脚本包含 vue-tsc -b，类型错误会直接让 CI 失败。
      - name: Build
        run: npm run build
